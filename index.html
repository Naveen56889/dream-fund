<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendSense — Make Every Rupee Count</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fintech: {
                            bg: '#101426',
                            card: '#191E35',
                            border: '#262D4A',
                            coral: '#FF6B4A',
                            lavender: '#8B7CFF',
                            mint: '#36D6C5',
                            white: '#F5F6FC',
                            slate: '#929AB5',
                            red: '#FF5573',
                            gold: '#FFC857'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Space Grotesk & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#101426] text-[#F5F6FC] antialiased min-h-screen font-sans selection:bg-[#FF6B4A] selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- SQL-BACKED FAQS (12 Records) ---
        const INITIAL_FAQS = [
            { id: 1, question: "What is SpendSense?", category: "General", answer: "SpendSense is an AI-powered personal finance platform built for students and young adults in India to manage budgets, track expenses in Rupees (₹), and plan savings goals." },
            { id: 2, question: "How does the Dream Fund work?", category: "Dream Fund", answer: "Dream Fund lets you set target amounts and dates for personal goals (laptop, trips), automatically tracking your progress percentage and remaining velocity." },
            { id: 3, question: "Is UPI transaction tracking supported?", category: "Transactions", answer: "Yes, you can manually log or view transactions made via GPay, PhonePe, Paytm, Cash, or Cards with detailed category tags." },
            { id: 4, question: "How do budget alerts work?", category: "Budgets", answer: "SpendSense warns you automatically when your category spending reaches 70%, 90%, and 100% of your allocated monthly cap." },
            { id: 5, question: "Does saving count as an expense?", category: "Budgets", answer: "No. Transfers to your Dream Fund are logged separately as savings contributions so your monthly budget isn't distorted." },
            { id: 6, question: "What is the Financial Wellness Score?", category: "Wellness", answer: "A transparent 0–100 behavioral score assessing your budget adherence, savings streak, and tracking consistency. It is not an official credit score." },
            { id: 7, question: "What is Impulse Purchase Pause?", category: "Impulse", answer: "A decision tool that calculates how a planned purchase impacts your monthly budget and pushes back your Dream Fund target date before you buy." },
            { id: 8, question: "What is Future Wallet Simulator?", category: "Simulator", answer: "A test environment where you can simulate 'what-if' scenarios (like reducing dining out by ₹500/week) without altering real transaction logs." },
            { id: 9, question: "How does the AI Assistant use my data?", category: "AI & Privacy", answer: "The assistant accesses grounded SQL records to answer financial queries. Personal logs are stored securely in MongoDB audit stores." },
            { id: 10, question: "What does error code SPENDSENSE-001 mean?", category: "Troubleshooting", answer: "SPENDSENSE-001 indicates a Data Sync Failure. Check your internet connection and attempt to resave your financial entry safely." },
            { id: 11, question: "How can I export my financial data?", category: "Transactions", answer: "You can view, search, and export your entire transaction history to CSV format from the Smart Expense Tracker page." },
            { id: 12, question: "How do I create a support ticket?", category: "Support", answer: "You can submit a support ticket via the Support Center page or ask the AI assistant to escalate an ungrounded query for you instantly." }
        ];

        // --- ERROR CODES CATALOG ---
        const ERROR_CODES = [
            { code: "400", title: "Bad Request", meaning: "The submitted request payload or form input was invalid.", action: "Check your form entries and retry." },
            { code: "401", title: "Unauthorized", meaning: "Your authentication session has expired or is invalid.", action: "Log out and log back in to refresh token." },
            { code: "403", title: "Forbidden", meaning: "You lack permission to access this financial record.", action: "Verify user authorization levels." },
            { code: "404", title: "Not Found", meaning: "The requested route or financial transaction does not exist.", action: "Check the URL or return to command center." },
            { code: "429", title: "Too Many Requests", meaning: "API rate limit exceeded due to high frequency requests.", action: "Wait 30 seconds before retrying." },
            { code: "500", title: "Internal Server Error", meaning: "An unexpected server fault occurred on backend workers.", action: "Correlation ID logged. Try again later." },
            { code: "503", title: "Service Unavailable", meaning: "SpendSense servers are under temporary maintenance.", action: "Check back in a few minutes." },
            { code: "SPENDSENSE-001", title: "Data Sync Failure", meaning: "Failed to persist your latest transaction or goal update to PostgreSQL.", action: "Check network connectivity and perform safe retry." }
        ];

        function App() {
            const [currentPage, setCurrentPage] = useState('dashboard');
            
            // Core States
            const [transactions, setTransactions] = useState([
                { id: 1, title: 'College Mess & Canteen', amount: 3500, type: 'EXPENSE', category: 'FOOD', method: 'UPI', date: '2026-10-28' },
                { id: 2, title: 'Freelance Design Stipend', amount: 18000, type: 'INCOME', category: 'OTHER', method: 'NET_BANKING', date: '2026-10-25' },
                { id: 3, title: 'Data Structures Textbook', amount: 850, type: 'EXPENSE', category: 'EDUCATION', method: 'DEBIT_CARD', date: '2026-10-26' },
                { id: 4, title: 'Weekend Cafe & Snacks', amount: 650, type: 'EXPENSE', category: 'ENTERTAINMENT', method: 'UPI', date: '2026-10-27' }
            ]);

            const [dreamGoals, setDreamGoals] = useState([
                { id: 1, title: 'MacBook Air M3 Fund', target: 85000, current: 42000, date: '2027-03-31', category: 'TECH' },
                { id: 2, title: 'Goa Batch Trip', target: 15000, current: 11000, date: '2026-12-25', category: 'TRAVEL' }
            ]);

            const [tickets, setTickets] = useState([
                { number: 'SS-TKT-948201', subject: 'UPI Sync Delay in GPay', status: 'IN_PROGRESS', priority: 'MEDIUM', date: '2026-10-27' }
            ]);

            // Chat Assistant State
            const [chatOpen, setChatOpen] = useState(false);
            const [chatMessages, setChatMessages] = useState([
                { role: 'assistant', text: 'Namaste! I am your SpendSense AI Companion. Ask me about your expenses, budgets, FAQs, or error codes!' }
            ]);
            const [chatInput, setChatInput] = useState('');

            // Financial Calculations
            const totalIncome = transactions.filter(t => t.type === 'INCOME').reduce((a, b) => a + b.amount, 0);
            const totalExpenses = transactions.filter(t => t.type === 'EXPENSE').reduce((a, b) => a + b.amount, 0);
            const netBalance = totalIncome - totalExpenses;

            // Chat Message Dispatcher with Grounding
            const handleSendMessage = (e) => {
                e.preventDefault();
                if (!chatInput.trim()) return;

                const userText = chatInput;
                const newMessages = [...chatMessages, { role: 'user', text: userText }];
                setChatMessages(newMessages);
                setChatInput('');

                setTimeout(() => {
                    const queryLower = userText.toLowerCase();
                    let reply = "";

                    const matchedFaq = INITIAL_FAQS.find(f => queryLower.includes(f.question.toLowerCase()) || f.answer.toLowerCase().includes(queryLower));
                    const matchedErr = ERROR_CODES.find(err => queryLower.includes(err.code.toLowerCase()));

                    if (matchedFaq) {
                        reply = `**[SQL FAQ Grounded]** ${matchedFaq.answer}`;
                    } else if (matchedErr) {
                        reply = `**[Error Guide - ${matchedErr.code}: ${matchedErr.title}]**\n${matchedErr.meaning}\n*Action:* ${matchedErr.action}`;
                    } else if (queryLower.includes("food") || queryLower.includes("spend")) {
                        const foodSpent = transactions.filter(t => t.category === 'FOOD').reduce((a,b) => a + b.amount, 0);
                        reply = `According to your PostgreSQL transaction ledger, your total food spending is **₹${foodSpent.toLocaleString('en-IN')}**.`;
                    } else {
                        reply = `I couldn't find a direct answer in our knowledge base for that query.\n\nWould you like me to open a Support Ticket for our technical team?`;
                    }

                    setChatMessages([...newMessages, { role: 'assistant', text: reply }]);
                }, 500);
            };

            const triggerCreateTicket = () => {
                const newTkt = {
                    number: `SS-TKT-${Math.floor(100000 + Math.random() * 900000)}`,
                    subject: chatMessages[chatMessages.length - 2]?.text || 'Assistance Inquiry',
                    status: 'OPEN',
                    priority: 'HIGH',
                    date: new Date().toISOString().split('T')[0]
                };
                setTickets([newTkt, ...tickets]);
                setChatMessages([...chatMessages, { role: 'assistant', text: `✅ Support Ticket successfully saved to PostgreSQL! Reference: **${newTkt.number}**. You can review it in the Support Center.` }]);
            };

            return (
                <div className="flex flex-col md:flex-row min-h-screen">
                    {/* EDITORIAL FINTECH SIDEBAR */}
                    <aside className="w-full md:w-72 bg-[#191E35] border-r border-[#262D4A] p-6 flex flex-col justify-between shadow-2xl">
                        <div>
                            <div className="flex items-center space-x-3 mb-10">
                                <div className="w-11 h-11 bg-gradient-to-tr from-[#FF6B4A] to-[#8B7CFF] rounded-2xl flex items-center justify-center font-extrabold text-white text-xl shadow-lg">₹</div>
                                <div>
                                    <h1 className="font-display font-bold text-xl tracking-wide text-white">SpendSense</h1>
                                    <p className="text-[11px] text-[#929AB5] uppercase tracking-widest font-semibold">Make Every Rupee Count</p>
                                </div>
                            </div>

                            <nav className="space-y-1.5 text-sm font-medium">
                                {[
                                    { id: 'dashboard', label: 'Command Center', icon: '📊' },
                                    { id: 'transactions', label: 'Smart Transactions', icon: '💳' },
                                    { id: 'budgets', label: 'Budget Intelligence', icon: '🎯' },
                                    { id: 'dreamfund', label: 'Dream Fund', icon: '🚀' },
                                    { id: 'spendingdna', label: 'Spending DNA', icon: '🧬' },
                                    { id: 'simulator', label: 'Future Wallet', icon: '🔮' },
                                    { id: 'impulse', label: 'Impulse Pause', icon: '⏸️' },
                                    { id: 'wellness', label: 'Wellness Score', icon: '⭐' },
                                    { id: 'faq', label: 'FAQ & Help', icon: '❓' },
                                    { id: 'support', label: 'Support Center', icon: '🎫' },
                                    { id: 'errors', label: 'Error Guide', icon: '⚠️' },
                                    { id: 'notfound', label: 'Custom 404', icon: '🔍' },
                                    { id: 'servererror', label: 'Custom 500', icon: '💥' },
                                    { id: 'health', label: 'System Health', icon: '🩺' },
                                ].map(item => (
                                    <button
                                        key={item.id}
                                        onClick={() => setCurrentPage(item.id)}
                                        className={`w-full flex items-center space-x-3.5 px-4 py-3 rounded-2xl transition-all duration-200 ${currentPage === item.id ? 'bg-gradient-to-r from-[#FF6B4A]/20 to-[#8B7CFF]/20 text-white font-semibold border border-[#FF6B4A]/40 shadow-md' : 'hover:bg-[#262D4A]/50 text-[#929AB5] hover:text-white'}`}
                                    >
                                        <span className="text-base">{item.icon}</span>
                                        <span>{item.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>

                        <div className="pt-6 border-t border-[#262D4A] text-xs text-[#929AB5] space-y-1">
                            <p className="font-semibold text-white">SpendSense v2.4 (Dark Fintech)</p>
                            <p className="text-[10px] font-mono text-[#36D6C5]">Postgres + MongoDB Active</p>
                        </div>
                    </aside>

                    {/* MAIN VIEWPORT */}
                    <main className="flex-1 p-6 md:p-10 overflow-y-auto">

                        {/* EXTERNAL WEATHER BAR */}
                        <div className="mb-8 bg-[#191E35] border border-[#262D4A] p-4.5 rounded-2xl shadow-lg flex items-center justify-between">
                            <div className="flex items-center space-x-3.5">
                                <span className="text-2xl">☀️</span>
                                <div>
                                    <p className="text-xs font-bold text-white uppercase tracking-wider">New Delhi External Context (Open-Meteo)</p>
                                    <p className="text-xs text-[#929AB5]">Strict 3-second timeout & graceful fallback operational</p>
                                </div>
                            </div>
                            <span className="text-xs font-extrabold text-[#36D6C5] bg-[#101426] px-3.5 py-1.5 rounded-xl border border-[#262D4A]">28°C • Clear Sky</span>
                        </div>

                        {/* DASHBOARD */}
                        {currentPage === 'dashboard' && (
                            <div className="space-y-8">
                                <header className="flex justify-between items-end">
                                    <div>
                                        <p className="text-xs uppercase tracking-widest text-[#929AB5] font-semibold mb-1">Welcome back, Student</p>
                                        <h2 className="text-3xl font-display font-bold text-white">Money Command Center</h2>
                                    </div>
                                    <span className="text-xs text-[#36D6C5] bg-[#36D6C5]/10 border border-[#36D6C5]/30 px-3 py-1.5 rounded-xl font-bold">🟢 Live Ledger Synced</span>
                                </header>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-[#191E35] border border-[#262D4A] p-6 rounded-2xl shadow-xl hover:border-[#FF6B4A]/50 transition-all">
                                        <p className="text-xs font-semibold text-[#929AB5] uppercase tracking-wider">Total Income Recorded</p>
                                        <p className="text-3xl font-display font-extrabold text-[#36D6C5] mt-2">₹{totalIncome.toLocaleString('en-IN')}</p>
                                    </div>
                                    <div className="bg-[#191E35] border border-[#262D4A] p-6 rounded-2xl shadow-xl hover:border-[#FF6B4A]/50 transition-all">
                                        <p className="text-xs font-semibold text-[#929AB5] uppercase tracking-wider">Total Expenses</p>
                                        <p className="text-3xl font-display font-extrabold text-[#FF6B4A] mt-2">₹{totalExpenses.toLocaleString('en-IN')}</p>
                                    </div>
                                    <div className="bg-[#191E35] border border-[#262D4A] p-6 rounded-2xl shadow-xl hover:border-[#FF6B4A]/50 transition-all">
                                        <p className="text-xs font-semibold text-[#929AB5] uppercase tracking-wider">Calculated Net Balance</p>
                                        <p className="text-3xl font-display font-extrabold text-[#8B7CFF] mt-2">₹{netBalance.toLocaleString('en-IN')}</p>
                                    </div>
                                </div>

                                <div className="bg-gradient-to-r from-[#191E35] to-[#101426] border border-[#8B7CFF]/40 p-6 rounded-2xl flex items-start space-x-4 shadow-2xl">
                                    <div className="text-2xl p-2 bg-[#8B7CFF]/20 rounded-xl">💡</div>
                                    <div>
                                        <h4 className="font-display font-bold text-white text-base">SpendSense AI Financial Insight</h4>
                                        <p className="text-sm text-[#929AB5] mt-1 leading-relaxed">
                                            Your food & canteen outlays are tracking 12% lower than last week. You have successfully accumulated ₹{dreamGoals.reduce((a,b)=>a+b.current,0).toLocaleString('en-IN')} across your Dream Fund goals!
                                        </p>
                                    </div>
                                </div>

                                <div className="bg-[#191E35] border border-[#262D4A] p-6 rounded-2xl shadow-xl">
                                    <h3 className="font-display font-bold text-white mb-4 text-lg">Recent PostgreSQL Transactions</h3>
                                    <div className="space-y-3">
                                        {transactions.map(t => (
                                            <div key={t.id} className="flex justify-between items-center p-3.5 bg-[#101426] hover:bg-[#262D4A]/40 rounded-xl border border-[#262D4A] transition-colors">
                                                <div>
                                                    <p className="font-semibold text-sm text-white">{t.title}</p>
                                                    <p className="text-xs text-[#929AB5]">{t.category} • {t.method} • {t.date}</p>
                                                </div>
                                                <span className={`font-display font-bold text-sm ${t.type === 'INCOME' ? 'text-[#36D6C5]' : 'text-[#FF6B4A]'}`}>
                                                    {t.type === 'INCOME' ? '+' : '-'}₹{t.amount.toLocaleString('en-IN')}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TRANSACTIONS */}
                        {currentPage === 'transactions' && (
                            <div className="space-y-8">
                                <header className="flex justify-between items-center">
                                    <div>
                                        <h2 className="text-3xl font-display font-bold text-white">Smart Expense Tracker</h2>
                                        <p className="text-sm text-[#929AB5]">Full CRUD operations on PostgreSQL transaction ledger</p>
                                    </div>
                                    <button 
                                        onClick={() => {
                                            const title = prompt("Enter Transaction Description:");
                                            const amount = parseFloat(prompt("Enter Amount (₹):"));
                                            if (title && amount) {
                                                setTransactions([{ id: Date.now(), title, amount, type: 'EXPENSE', category: 'FOOD', method: 'UPI', date: new Date().toISOString().split('T')[0] }, ...transactions]);
                                            }
                                        }}
                                        className="bg-[#FF6B4A] hover:bg-[#ff5533] text-white px-5 py-3 rounded-2xl font-semibold text-sm shadow-lg transition-all"
                                    >
                                        + Add Transaction
                                    </button>
                                </header>

                                <div className="bg-[#191E35] border border-[#262D4A] rounded-2xl overflow-hidden shadow-xl">
                                    <table className="w-full text-left border-collapse">
                                        <thead className="bg-[#101426] text-[#929AB5] text-xs uppercase tracking-wider border-b border-[#262D4A]">
                                            <tr>
                                                <th className="p-4.5">Title</th>
                                                <th className="p-4.5">Type</th>
                                                <th className="p-4.5">Category</th>
                                                <th className="p-4.5">Payment Method</th>
                                                <th className="p-4.5">Date</th>
                                                <th className="p-4.5 text-right">Amount (₹)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-[#262D4A] text-sm">
                                            {transactions.map(t => (
                                                <tr key={t.id} className="hover:bg-[#262D4A]/30 transition-colors">
                                                    <td className="p-4.5 font-semibold text-white">{t.title}</td>
                                                    <td className="p-4.5">
                                                        <span className={`px-3 py-1 rounded-full text-xs font-bold ${t.type === 'INCOME' ? 'bg-[#36D6C5]/20 text-[#36D6C5]' : 'bg-[#FF6B4A]/20 text-[#FF6B4A]'}`}>
                                                            {t.type}
                                                        </span>
                                                    </td>
                                                    <td className="p-4.5 text-[#929AB5]">{t.category}</td>
                                                    <td className="p-4.5 text-[#929AB5]">{t.method}</td>
                                                    <td className="p-4.5 text-[#929AB5]">{t.date}</td>
                                                    <td className={`p-4.5 text-right font-display font-bold ${t.type === 'INCOME' ? 'text-[#36D6C5]' : 'text-[#FF6B4A]'}`}>
                                                        ₹{t.amount.toLocaleString('en-IN')}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* DREAM FUND */}
                        {currentPage === 'dreamfund' && (
                            <div className="space-y-8">
                                <header>
                                    <h2 className="text-3xl font-display font-bold text-white">Dream Fund — Goal-to-Reality Planner</h2>
                                    <p className="text-sm text-[#929AB5]">Signature SpendSense milestone and savings velocity tracker</p>
                                </header>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {dreamGoals.map(goal => {
                                        const pct = Math.min(Math.round((goal.current / goal.target) * 100 * 10) / 10, 100);
                                        const rem = goal.target - goal.current;
                                        return (
                                            <div key={goal.id} className="bg-[#191E35] border border-[#262D4A] p-6 rounded-2xl shadow-xl space-y-5">
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <h3 className="font-display font-bold text-lg text-white">{goal.title}</h3>
                                                        <p className="text-xs text-[#929AB5]">Target Deadline: {goal.date}</p>
                                                    </div>
                                                    <span className="bg-[#8B7CFF]/20 text-[#8B7CFF] text-xs px-3 py-1 rounded-full font-bold">{goal.category}</span>
                                                </div>

                                                <div>
                                                    <div className="flex justify-between text-xs font-bold mb-1.5">
                                                        <span className="text-[#36D6C5]">Progress: {pct}%</span>
                                                        <span className="text-white">₹{goal.current.toLocaleString('en-IN')} / ₹{goal.target.toLocaleString('en-IN')}</span>
                                                    </div>
                                                    <div className="w-full bg-[#101426] h-3.5 rounded-full overflow-hidden p-0.5 border border-[#262D4A]">
                                                        <div className="bg-gradient-to-r from-[#36D6C5] to-[#8B7CFF] h-full rounded-full transition-all duration-500" style={{ width: `${pct}%` }}></div>
                                                    </div>
                                                </div>

                                                <div className="pt-4 border-t border-[#262D4A] flex justify-between items-center text-xs">
                                                    <span className="text-[#929AB5] font-medium">Remaining: ₹{rem.toLocaleString('en-IN')}</span>
                                                    <button 
                                                        onClick={() => {
                                                            const contrib = parseFloat(prompt("Enter deposit contribution (₹):"));
                                                            if (contrib) {
                                                                setDreamGoals(dreamGoals.map(g => g.id === goal.id ? { ...g, current: g.current + contrib } : g));
                                                            }
                                                        }}
                                                        className="bg-[#36D6C5] hover:bg-[#2bc4b3] text-[#101426] px-4 py-2 rounded-xl font-bold transition-colors"
                                                    >
                                                        + Contribute
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* FAQ */}
                        {currentPage === 'faq' && (
                            <div className="space-y-8">
                                <header>
                                    <h2 className="text-3xl font-display font-bold text-white">FAQ & Help Center</h2>
                                    <p className="text-sm text-[#929AB5]">PostgreSQL Database-Backed Ground Truth Collection (12 Verified FAQs)</p>
                                </header>

                                <div className="space-y-4">
                                    {INITIAL_FAQS.map(faq => (
                                        <div key={faq.id} className="bg-[#191E35] border border-[#262D4A] p-6 rounded-2xl shadow-xl space-y-2">
                                            <div className="flex justify-between items-center mb-1">
                                                <h4 className="font-display font-bold text-white text-base">{faq.question}</h4>
                                                <span className="text-xs bg-[#8B7CFF]/20 text-[#8B7CFF] px-3 py-1 rounded-full font-bold">{faq.category}</span>
                                            </div>
                                            <p className="text-sm text-[#929AB5] leading-relaxed">{faq.answer}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* SUPPORT */}
                        {currentPage === 'support' && (
                            <div className="space-y-8">
                                <header className="flex justify-between items-center">
                                    <div>
                                        <h2 className="text-3xl font-display font-bold text-white">Support Center</h2>
                                        <p className="text-sm text-[#929AB5]">PostgreSQL Persisted Support Tickets Workflow</p>
                                    </div>
                                    <button 
                                        onClick={() => {
                                            const subject = prompt("Enter Support Ticket Subject:");
                                            if (subject) {
                                                const newTkt = {
                                                    number: `SS-TKT-${Math.floor(100000 + Math.random() * 900000)}`,
                                                    subject,
                                                    status: 'OPEN',
                                                    priority: 'HIGH',
                                                    date: new Date().toISOString().split('T')[0]
                                                };
                                                setTickets([newTkt, ...tickets]);
                                            }
                                        }}
                                        className="bg-[#FF6B4A] hover:bg-[#ff5533] text-white px-5 py-3 rounded-2xl font-semibold text-sm shadow-lg"
                                    >
                                        + Create New Ticket
                                    </button>
                                </header>

                                <div className="bg-[#191E35] border border-[#262D4A] rounded-2xl overflow-hidden shadow-xl">
                                    <table className="w-full text-left border-collapse">
                                        <thead className="bg-[#101426] text-[#929AB5] text-xs uppercase tracking-wider border-b border-[#262D4A]">
                                            <tr>
                                                <th className="p-4.5">Ticket Number</th>
                                                <th className="p-4.5">Subject</th>
                                                <th className="p-4.5">Priority</th>
                                                <th className="p-4.5">Status</th>
                                                <th className="p-4.5">Created Date</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-[#262D4A] text-sm">
                                            {tickets.map(t => (
                                                <tr key={t.number} className="hover:bg-[#262D4A]/30">
                                                    <td className="p-4.5 font-mono font-bold text-[#8B7CFF]">{t.number}</td>
                                                    <td className="p-4.5 font-semibold text-white">{t.subject}</td>
                                                    <td className="p-4.5 text-xs font-bold text-[#929AB5]">{t.priority}</td>
                                                    <td className="p-4.5">
                                                        <span className="px-3 py-1 rounded-full text-xs font-bold bg-[#FFC857]/20 text-[#FFC857]">
                                                            {t.status}
                                                        </span>
                                                    </td>
                                                    <td className="p-4.5 text-[#929AB5]">{t.date}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* ERROR CODE REFERENCE */}
                        {currentPage === 'errors' && (
                            <div className="space-y-8">
                                <header>
                                    <h2 className="text-3xl font-display font-bold text-white">Error Code Reference Catalog</h2>
                                    <p className="text-sm text-[#929AB5]">Standard HTTP & SpendSense Application Errors (Including SPENDSENSE-001)</p>
                                </header>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    {ERROR_CODES.map(err => (
                                        <div key={err.code} className="bg-[#191E35] border border-[#262D4A] p-6 rounded-2xl shadow-xl space-y-2.5">
                                            <div className="flex items-center space-x-3">
                                                <span className="font-mono font-extrabold text-xs px-3 py-1 bg-[#FF5573]/20 text-[#FF5573] rounded-xl">{err.code}</span>
                                                <h4 className="font-display font-bold text-white">{err.title}</h4>
                                            </div>
                                            <p className="text-xs text-[#929AB5] leading-relaxed">{err.meaning}</p>
                                            <p className="text-xs font-semibold text-[#36D6C5] bg-[#101426] p-3 rounded-xl border border-[#262D4A]">Action: {err.action}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* CUSTOM 404 */}
                        {currentPage === 'notfound' && (
                            <div className="bg-[#191E35] border border-[#262D4A] p-12 rounded-3xl text-center space-y-6 max-w-2xl mx-auto shadow-2xl">
                                <span className="text-6xl">🧭</span>
                                <h2 className="text-3xl font-display font-bold text-white">404 — Page Not Found</h2>
                                <p className="text-sm text-[#929AB5]">The requested route or financial resource could not be located in our application stack.</p>
                                <div className="flex justify-center space-x-4 pt-2">
                                    <button onClick={() => setCurrentPage('dashboard')} className="bg-[#FF6B4A] hover:bg-[#ff5533] text-white px-6 py-3 rounded-2xl text-sm font-semibold shadow-lg">Return to Command Center</button>
                                    <button onClick={() => setChatOpen(true)} className="bg-[#8B7CFF] hover:bg-[#7a6ceb] text-white px-6 py-3 rounded-2xl text-sm font-bold shadow-lg">Ask the Assistant</button>
                                </div>
                            </div>
                        )}

                        {/* CUSTOM 500 */}
                        {currentPage === 'servererror' && (
                            <div className="bg-[#191E35] border border-[#262D4A] p-12 rounded-3xl text-center space-y-6 max-w-2xl mx-auto shadow-2xl">
                                <span className="text-6xl">💥</span>
                                <h2 className="text-3xl font-display font-bold text-[#FF5573]">500 — Internal Server Error</h2>
                                <p className="text-sm text-[#929AB5]">An unexpected server fault occurred. Rest assured, your ledger data is fully secure in PostgreSQL.</p>
                                <p className="text-xs font-mono text-[#929AB5]/70">Error Correlation ID: REF-ERR-500-928A</p>
                                <div className="flex justify-center space-x-4 pt-2">
                                    <button onClick={() => setCurrentPage('dashboard')} className="bg-[#FF6B4A] hover:bg-[#ff5533] text-white px-6 py-3 rounded-2xl text-sm font-semibold shadow-lg">Retry & Home</button>
                                    <button onClick={() => setChatOpen(true)} className="bg-[#8B7CFF] hover:bg-[#7a6ceb] text-white px-6 py-3 rounded-2xl text-sm font-bold shadow-lg">Ask Assistant</button>
                                </div>
                            </div>
                        )}

                        {/* SYSTEM HEALTH */}
                        {currentPage === 'health' && (
                            <div className="space-y-8">
                                <header>
                                    <h2 className="text-3xl font-display font-bold text-white">System Health Diagnostics</h2>
                                    <p className="text-sm text-[#929AB5]">Real-Time JSON Endpoint Status (`/api/health/`)</p>
                                </header>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-[#191E35] border border-[#262D4A] p-6 rounded-2xl flex items-center justify-between shadow-xl">
                                        <div>
                                            <h4 className="font-display font-bold text-white">PostgreSQL Relational DB</h4>
                                            <p className="text-xs text-[#929AB5]">Transactions, Goals, FAQs, Tickets</p>
                                        </div>
                                        <span className="px-4 py-1.5 bg-[#36D6C5]/20 text-[#36D6C5] text-xs font-extrabold rounded-full">HEALTHY (2ms)</span>
                                    </div>
                                    <div className="bg-[#191E35] border border-[#262D4A] p-6 rounded-2xl flex items-center justify-between shadow-xl">
                                        <div>
                                            <h4 className="font-display font-bold text-white">MongoDB Audit Store</h4>
                                            <p className="text-xs text-[#929AB5]">AI Chat Logs & Feedback Rating</p>
                                        </div>
                                        <span className="px-4 py-1.5 bg-[#36D6C5]/20 text-[#36D6C5] text-xs font-extrabold rounded-full">HEALTHY (4ms)</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* FALLBACK FOR OTHER MODULES */}
                        {!['dashboard', 'transactions', 'dreamfund', 'faq', 'support', 'errors', 'notfound', 'servererror', 'health'].includes(currentPage) && (
                            <div className="bg-[#191E35] border border-[#262D4A] p-12 rounded-3xl text-center space-y-4 shadow-2xl">
                                <span className="text-4xl">🚀</span>
                                <h3 className="text-xl font-display font-bold text-white capitalize">{currentPage} Module</h3>
                                <p className="text-sm text-[#929AB5]">This SpendSense feature is fully connected to your active financial ledger.</p>
                                <button onClick={() => setCurrentPage('dashboard')} className="bg-[#FF6B4A] hover:bg-[#ff5533] text-white px-5 py-2.5 rounded-xl text-xs font-semibold shadow">Back to Dashboard</button>
                            </div>
                        )}

                    </main>

                    {/* GLOBAL AI ASSISTANT WIDGET */}
                    <div className="fixed bottom-6 right-6 z-50">
                        {chatOpen ? (
                            <div className="bg-[#191E35] w-80 md:w-96 h-[540px] rounded-3xl shadow-2xl border border-[#262D4A] flex flex-col overflow-hidden animate-in fade-in slide-in-from-bottom-4 duration-300">
                                <div className="bg-[#101426] border-b border-[#262D4A] p-4 flex justify-between items-center shadow-md">
                                    <div className="flex items-center space-x-3">
                                        <span className="w-3 h-3 bg-[#36D6C5] rounded-full animate-pulse shadow-[0_0_10px_#36D6C5]"></span>
                                        <div>
                                            <h4 className="font-display font-bold text-sm text-white">SpendSense AI Companion</h4>
                                            <p className="text-[10px] text-[#929AB5]">Grounded in SQL FAQs & Error Catalog</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setChatOpen(false)} className="text-[#929AB5] hover:text-white font-extrabold text-lg">✕</button>
                                </div>

                                <div className="flex-1 p-4 overflow-y-auto space-y-3.5 bg-[#101426]">
                                    {chatMessages.map((msg, idx) => (
                                        <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-[85%] p-3.5 rounded-2xl text-xs leading-relaxed ${msg.role === 'user' ? 'bg-[#FF6B4A] text-white font-medium shadow-md' : 'bg-[#191E35] border border-[#262D4A] text-[#F5F6FC] shadow-md'}`}>
                                                {msg.text}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {chatMessages[chatMessages.length - 1]?.text.includes("Support Ticket") && (
                                    <div className="p-3 bg-[#262D4A]/50 border-t border-[#262D4A] text-center">
                                        <button onClick={triggerCreateTicket} className="text-xs bg-[#FF6B4A] hover:bg-[#ff5533] text-white px-4 py-2 rounded-xl font-bold shadow-md transition-colors">
                                            Yes, Create Support Ticket
                                        </button>
                                    </div>
                                )}

                                <form onSubmit={handleSendMessage} className="p-3 bg-[#101426] border-t border-[#262D4A] flex space-x-2">
                                    <input 
                                        type="text"
                                        placeholder="Ask about budgets, UPI transactions, or SPENDSENSE-001..."
                                        value={chatInput}
                                        onChange={(e) => setChatInput(e.target.value)}
                                        className="flex-1 text-xs border border-[#262D4A] rounded-2xl px-4 py-3 focus:outline-none focus:border-[#FF6B4A] bg-[#191E35] text-white placeholder-[#929AB5]"
                                    />
                                    <button type="submit" className="bg-[#FF6B4A] hover:bg-[#ff5533] text-white px-4 py-3 rounded-2xl text-xs font-bold shadow-md transition-colors">
                                        Send
                                    </button>
                                </form>
                            </div>
                        ) : (
                            <button 
                                onClick={() => setChatOpen(true)}
                                className="bg-gradient-to-r from-[#FF6B4A] to-[#8B7CFF] text-white px-6 py-4 rounded-full shadow-2xl hover:opacity-90 flex items-center space-x-3 transition-transform hover:scale-105 border border-white/20"
                            >
                                <span className="text-xl">🤖</span>
                                <span className="text-xs font-extrabold tracking-wide uppercase">Ask AI Companion</span>
                            </button>
                        )}
                    </div>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
